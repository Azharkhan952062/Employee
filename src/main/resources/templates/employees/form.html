<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${isEdit} ? 'Edit Employee' : 'Add New Employee')}"></head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div th:replace="~{fragments/layout :: sidebar('employees')}"></div>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <header th:replace="~{fragments/layout :: topbar(${isEdit} ? 'Edit Employee Record' : 'Onboard New Employee')}"></header>

            <main class="content-body">
                <!-- Flash Alerts -->
                <div th:replace="~{fragments/layout :: alerts}"></div>

                <!-- Form Card -->
                <div class="form-card">
                    <div class="form-header">
                        <h2 th:text="${isEdit} ? 'Update Employee Profile' : 'New Employee Information'">Employee Information</h2>
                        <p th:text="${isEdit} ? 'Modify personal, department, and compensation details.' : 'Enter employee personal, contact, and employment information.'">
                            Enter employee information below.
                        </p>
                    </div>

                    <form th:action="${isEdit} ? @{/employees/{id}(id=${employee.id})} : @{/employees}" 
                          th:object="${employee}" method="post" novalidate>

                        <!-- Hidden ID for Edit -->
                        <input type="hidden" th:if="${isEdit}" th:field="*{id}" />

                        <div class="form-grid">
                            <!-- First Name -->
                            <div class="form-group">
                                <label class="form-label" for="firstName">First Name <span class="required">*</span></label>
                                <input type="text" id="firstName" th:field="*{firstName}" 
                                       class="form-input" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                       placeholder="e.g. John" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">
                                    First name error
                                </div>
                            </div>

                            <!-- Last Name -->
                            <div class="form-group">
                                <label class="form-label" for="lastName">Last Name <span class="required">*</span></label>
                                <input type="text" id="lastName" th:field="*{lastName}" 
                                       class="form-input" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                       placeholder="e.g. Doe" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">
                                    Last name error
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="form-group">
                                <label class="form-label" for="email">Work Email Address <span class="required">*</span></label>
                                <input type="email" id="email" th:field="*{email}" 
                                       class="form-input" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       placeholder="e.g. john.doe@company.com" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                    Email error
                                </div>
                            </div>

                            <!-- Phone Number -->
                            <div class="form-group">
                                <label class="form-label" for="phoneNumber">Contact Phone <span class="required">*</span></label>
                                <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" 
                                       class="form-input" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                                       placeholder="e.g. +1 555-0199" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">
                                    Phone number error
                                </div>
                            </div>

                            <!-- Department -->
                            <div class="form-group">
                                <label class="form-label" for="department">Department <span class="required">*</span></label>
                                <select id="department" th:field="*{department}" 
                                        class="form-select" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'" required>
                                    <option value="">-- Select Department --</option>
                                    <option th:each="dept : ${departments}" 
                                            th:value="${dept.name()}" 
                                            th:text="${dept.displayName}">Department</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">
                                    Department error
                                </div>
                            </div>

                            <!-- Designation -->
                            <div class="form-group">
                                <label class="form-label" for="designation">Job Title / Designation <span class="required">*</span></label>
                                <input type="text" id="designation" th:field="*{designation}" 
                                       class="form-input" th:classappend="${#fields.hasErrors('designation')} ? 'is-invalid'"
                                       placeholder="e.g. Senior Software Engineer" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}">
                                    Designation error
                                </div>
                            </div>

                            <!-- Annual Salary -->
                            <div class="form-group">
                                <label class="form-label" for="salary">Annual Salary (USD) <span class="required">*</span></label>
                                <input type="number" step="0.01" min="0.01" id="salary" th:field="*{salary}" 
                                       class="form-input" th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'"
                                       placeholder="e.g. 95000.00" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}">
                                    Salary error
                                </div>
                            </div>

                            <!-- Joining Date -->
                            <div class="form-group">
                                <label class="form-label" for="joiningDate">Joining Date <span class="required">*</span></label>
                                <input type="date" id="joiningDate" th:field="*{joiningDate}" 
                                       class="form-input" th:classappend="${#fields.hasErrors('joiningDate')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('joiningDate')}" th:errors="*{joiningDate}">
                                    Joining date error
                                </div>
                            </div>

                            <!-- Status -->
                            <div class="form-group full-width">
                                <label class="form-label" for="status">Employment Status <span class="required">*</span></label>
                                <select id="status" th:field="*{status}" 
                                        class="form-select" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'" required>
                                    <option th:each="st : ${statuses}" 
                                            th:value="${st.name()}" 
                                            th:text="${st.displayName}">Status</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">
                                    Status error
                                </div>
                            </div>
                        </div>

                        <!-- Form Actions -->
                        <div class="form-actions">
                            <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary" 
                                    th:text="${isEdit} ? 'Update Employee' : 'Create Employee'">
                                Save Employee
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
