# Server configuration (Render dynamically sets PORT)
server.port=${PORT:8080}
spring.application.name=employee-management-system

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Datasource configuration
# Defaults to H2 in PostgreSQL compatibility mode for instant local testing without local PostgreSQL installation.
# In production on Render, set SPRING_DATASOURCE_URL or Render's DATABASE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:emsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local H2 web console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging
logging.level.com.ems.employeemanagement=INFO
logging.level.org.springframework.web=INFO
