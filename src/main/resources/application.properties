# Server configuration (Render dynamically sets PORT, defaults to 8080)
server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=employee-management-system

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Datasource configuration:
# 1. First precedence: DB_URL / DB_USERNAME / DB_PASSWORD (standard Render/cloud env vars)
# 2. Second precedence: SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# 3. Fallback: Local H2 database in PostgreSQL compatibility mode for instant local testing
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:h2:mem:emsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.driver-class-name=${DB_DRIVER:${SPRING_DATASOURCE_DRIVER:org.h2.Driver}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local H2 web console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Logging
logging.level.com.ems.employeemanagement=INFO
logging.level.org.springframework.web=INFO
