# ==============================================================================
# Render Blueprint Configuration (render.yaml)
# Automatically deploys the Spring Boot Web Service & Managed PostgreSQL
# ==============================================================================

services:
  # Web Application Service
  - type: web
    name: employee-management-system
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /login
    envVars:
      - key: PORT
        value: 10000
      - key: DB_URL
        fromDatabase:
          name: ems-postgres
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: ems-postgres
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: ems-postgres
    plan: free
    region: oregon
    databaseName: emsdb
    user: emsuser
